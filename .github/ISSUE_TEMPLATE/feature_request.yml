name: Feature request
description: Suggest something new for inkstand (the application layer), or a change to how something works.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. inkstand sits below every application - describe the general need ("a subject", "a record"), not your app's vocabulary.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, and why it cannot be done well with what is there today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The behaviour you want. An API sketch is welcome but not required.
      render: c
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - state/
        - persist/
        - form/
        - nav/
        - app/
        - Build / CMake
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Workarounds you use now, or how you would build it in your own code.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
