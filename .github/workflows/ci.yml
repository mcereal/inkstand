name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug (gcc)
            cc: gcc
            args: ""
          # clang as well as gcc, for inkwell's and inkcell's reason: the two disagree about
          # which conversions and function-pointer mismatches are warnings and which are
          # errors, and a consumer building with clang should not be the one to find out.
          - name: debug (clang)
            cc: clang
            args: ""
          - name: asan+ubsan (clang)
            cc: clang
            args: "-DINKSTAND_ENABLE_ASAN=ON -DINKSTAND_ENABLE_UBSAN=ON"
          # The claim that state/ and persist/ need no toolkit is worth nothing if nobody builds
          # them without one. inkcell is not configured at all on this job, so an inkcell
          # include in the headless half fails the compile here - the same reason inkwell has a
          # job with no Mbed TLS and inkcell one with no SDL2.
          - name: headless (gcc)
            cc: gcc
            args: "-DINKSTAND_WITH_UI=OFF"
    steps:
      # inkwell and inkcell are submodules, and inkwell nests Mbed TLS; the default checkout
      # leaves gitlinks and empty directories, which fails at the first add_subdirectory().
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # libclang-rt-18-dev is the one that is easy to miss: Ubuntu's clang package does not pull
      # the sanitizer runtimes in, and without them the link fails looking for
      # libclang_rt.asan-x86_64.a rather than at anything to do with this code.
      - name: Install build tools
        run: >
          sudo apt-get update &&
          sudo apt-get install -y ninja-build clang libclang-rt-18-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.args }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # macOS is a target like Linux, and the job that notices a kernel call spelled out above
  # inkwell - an epoll or a timerfd compiles here and nowhere else.
  macos:
    name: debug (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A venv for the Mbed TLS generator under inkwell, because Homebrew's Python refuses a
      # --user install (PEP 668), and passed by path because CMake otherwise finds that one first.
      - name: Install build tools
        run: |
          brew install ninja
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install jinja2 jsonschema

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DPython3_EXECUTABLE="$RUNNER_TEMP/venv/bin/python3"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      # The file list is the Makefile's, so the exclusions are named once.
      - name: Check formatting
        run: make format-check CLANG_FORMAT=clang-format-18
